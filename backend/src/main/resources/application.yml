spring:
  application:
    name: demand-forecast-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demand_forecast}
    username: ${POSTGRES_USER:forecast_app}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never

app:
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    connect-timeout: ${ML_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${ML_SERVICE_READ_TIMEOUT:10s}

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  storage:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}